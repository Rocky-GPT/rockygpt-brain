[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rockygpt-brain"
version = "1.0.0"
description = "RockyGPT brain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "certifi>=2024.7.4",
  "fastapi>=0.115.0",
  "openai==1.109.1",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rockygpt_brain"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tests", "scripts"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.coverage.run]
source = ["src/rockygpt_brain"]
