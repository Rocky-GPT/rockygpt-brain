# Blueprint for the production brain (https://rockygpt-brain.onrender.com).
#
# Render stores secret values in the dashboard, never here, so every entry
# below is `sync: false` — the key is declared and version-controlled, the
# value stays where it already is. Applying this blueprint therefore does
# not overwrite live credentials.
#
# Note what that does and does not buy: a var going *missing* now shows up
# as a diff, but a var holding a *stale* value still does not. The
# 2026-08-27 outage — production answering normally while every chat turn
# failed to persist against Neon — was a stale password, and this file
# would not have caught it. Rotations still have to be applied by hand in
# both Render and the local .env files.
services:
  - type: web
    name: rockygpt-brain
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Render injects PORT; the container reads it via Settings at startup.
      - key: APP_ENV
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHAT_LOG_HASH_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      # Nothing in src/ reads this today, but it is deliberately kept: the
      # UI HMACs each visitor's network address with it to rate-limit abuse
      # without storing raw IPs, and rockygpt-infra's README requires the
      # same value in both services. Grepping this repo alone makes it look
      # unused, which is very nearly how it got deleted. Leave it.
      - key: ABUSE_HASH_KEY
        sync: false
