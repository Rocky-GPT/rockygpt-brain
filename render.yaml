# Deployment requirements for the new office-facts runtime.
# No Blueprint is connected to the live service. This file does not deploy it.
# Production follows main; this dev implementation needs a separate reviewed
# promotion. Set every secret in Render before promotion. The UI server must
# send the matching environment token; never expose it in browser JavaScript.
services:
  - type: web
    name: rockygpt-brain
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readiness
    envVars:
      # Render injects PORT; the Dockerfile's start command binds it.
      # Exactly `production`.
      - key: BRAIN_ENVIRONMENT
        sync: false
      # Production-only key/project with access to the bundled provider release.
      - key: BRAIN_OPENAI_API_KEY
        sync: false
      - key: BRAIN_OPENAI_PROJECT
        sync: false
      # Non-superuser login granted only brain_production (migrations/001).
      # Never use a database owner or a login holding both environment roles.
      - key: BRAIN_LEDGER_DATABASE_URL
        sync: false
      # Read-only campus data and published canonical identity release.
      - key: DATABASE_URL
        sync: false
      # Required server-to-server ingress authentication in production.
      - key: STAGING_SERVICE_TOKEN
        sync: false
