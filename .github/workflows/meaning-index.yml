name: Meaning index

# After the daily data publish (rockygpt-data, 11:00 UTC, up to three hours), build the meaning
# index for production's active release and store it beside the release in the campus database,
# where the Brain loads it (PostgresEntityFacts.meaning_index). Only texts that changed since the
# last run are embedded: the embedding and question caches are kept between runs.

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meaning-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -e '.[graph]'
      - name: Restore the embedding and question caches
        uses: actions/cache@v4
        with:
          path: .meaning-cache
          key: meaning-cache-${{ github.run_id }}
          restore-keys: meaning-cache-
      - name: Build the release graph from the campus database
        env:
          DATABASE_URL: ${{ secrets.MEANING_INDEX_DATABASE_URL }}
        run: python scripts/build_graph.py --out .published
      - name: Build the meaning index
        env:
          BRAIN_OPENAI_API_KEY: ${{ secrets.MEANING_INDEX_OPENAI_API_KEY }}
          BRAIN_OPENAI_PROJECT: ${{ secrets.MEANING_INDEX_OPENAI_PROJECT }}
        run: python scripts/build_meaning_index.py --dir .published --cache .meaning-cache
      - name: Store it beside the release
        env:
          DATABASE_URL: ${{ secrets.MEANING_INDEX_DATABASE_URL }}
        run: python scripts/publish_meaning_index.py --dir .published
