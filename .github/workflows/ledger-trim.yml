name: Ledger trim

# Deletes the spending-ledger rows that are history only: settled model calls and answer turns
# older than 60 days (src/rockygpt_brain/ledger_trim.py). Holds that never settled stay. The
# ledger shares Neon's free 0.5 GB with nothing else now, and a full database stops the ledger,
# which stops every AI answer. This moved here from the data repo's weekly cleanup (audit
# 2026-11-17, item 15). LEDGER_OWNER_DATABASE_URL is a login that may delete (the database
# owner), synced from 1Password by rockygpt-infra's Environment Sync (target brain-actions).
on:
  schedule:
    - cron: '37 8 * * 0'  # Sundays, 03:37 New York (EST), the old cleanup's slot
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Count the rows only, delete nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ledger-trim
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - name: Trim the ledger
        env:
          LEDGER_OWNER_DATABASE_URL: ${{ secrets.LEDGER_OWNER_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python scripts/trim_ledger.py $DRY_RUN
