name: Price window

# release.json fails closed once its verified price window ends: from that day
# every chat and readiness check returns 503. Open an issue two weeks ahead,
# remind at 7, 3 and 1 days and on the day, and close it once renewed.
on:
  schedule:
    - cron: '0 14 * * *' # 10:00 in New York during daylight time
  workflow_dispatch:
    inputs:
      warn_days:
        description: Days before expiry to open the issue
        default: '14'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      ASSIGNEE: daniel-rajakumar
      WARN_DAYS: ${{ inputs.warn_days || '14' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the verified price window
        run: |
          # The Brain compares the date in New York with valid_until.
          read -r model valid_until days < <(python3 -c "
          import json
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          release = json.load(open('src/rockygpt_brain/release.json'))
          until = date.fromisoformat(release['price']['valid_until'])
          today = datetime.now(ZoneInfo('America/New_York')).date()
          print(release['model'], until.isoformat(), (until - today).days)
          ")
          echo "$model price valid until $valid_until: $days day(s) left"
          issue=$(gh issue list --repo "$REPOSITORY" --state open --label price-window \
            --json number --jq '.[0].number // empty')
          if [ "$days" -gt "$WARN_DAYS" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$REPOSITORY" \
                --comment "Renewed: the $model price is now valid until $valid_until."
            fi
            exit 0
          fi
          if [ "$days" -le 0 ]; then
            status="expired on $valid_until. Every chat and readiness check now fails closed."
          else
            status="expires on $valid_until, in $days day(s). From that day every chat and readiness check fails closed."
          fi
          body="The verified $model price in src/rockygpt_brain/release.json $status

          Check the price on the model page linked in its \`source\`, set a new \`version\` and \`valid_until\` (and \`valid_from\` if the price changed), then deploy the Brain.

          Run: $GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$issue" ]; then
            gh label create price-window --repo "$REPOSITORY" --color D93F0B \
              --description "The Brain's verified price window is close to expiring" --force
            gh issue create --repo "$REPOSITORY" --title "[Price window] $model price expires $valid_until" \
              --label price-window --assignee "$ASSIGNEE" --body "$body"
          elif [ "$days" -le 1 ] || [ "$days" -eq 3 ] || [ "$days" -eq 7 ]; then
            gh issue comment "$issue" --repo "$REPOSITORY" --body "$body"
          fi
