name: Brain checks
on:
  push:
  pull_request:
  # Release merges need checks even when older development commits skipped CI.
  # This event ignores commit-message skip directives. Only merged, trusted
  # main-branch code is executed; unmerged PR closures never run this job.
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: brain_gateway_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brain_gateway_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BRAIN_GATEWAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/brain_gateway_test_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,graph]'
      - run: ruff check .
      - run: mypy src tests scripts
      - run: pytest -q
      - name: Replay HTTP regressions without paid calls
        run: python scripts/check_chat.py --out /tmp/chat-regression.json
      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-chat-regression
          path: /tmp/chat-regression.json
          if-no-files-found: ignore

  release-result:
    # GitHub attaches pull_request_target runs to the PR head, even though the
    # checks above test the merge. Render needs the result on main's commit.
    needs: checks
    if: always() && github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Record checked release commit
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CHECK_RESULT: ${{ needs.checks.result }}
        run: |
          conclusion=failure
          if [ "$CHECK_RESULT" = success ]; then conclusion=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='Release checks' \
            -f head_sha="$MERGE_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
